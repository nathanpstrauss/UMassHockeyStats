<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Recap — UMass Hockey</title>

<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;700&family=Oswald:wght@400;500;600;700;800;900&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F1;--surface:#FFFFFF;--surface2:#FAF8F4;--surface3:#EFEBE3;
  --border:#E4DFD7;--border2:#CEC8BD;--border-faint:#EFEBE4;
  --text:#1B1714;--muted:#8B847A;--muted2:#A9A299;
  --maroon:#881C1C;--maroon2:#A82626;--maroon-dim:#F4E7E7;--maroon-line:#E2C4C4;
  --gold:#B0892E;--gold-dim:#F6EFDD;--gold-border:#E6D5A8;
  --green:#1F7A4D;--red:#B23A3A;--blue:#2E5E9E;
  --font-display:'Zilla Slab',Georgia,'Times New Roman',serif;
  --font-ui:'Oswald','Arial Narrow',sans-serif;
  --font-body:'Source Sans 3',system-ui,-apple-system,sans-serif;
  --shadow-xs:0 1px 2px rgba(40,30,20,.05);
  --shadow-sm:0 1px 3px rgba(40,30,20,.07),0 1px 2px rgba(40,30,20,.04);
}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;min-height:100vh}
a{color:inherit;text-decoration:none}

/* ── NAV ─────────────────────────────────────────────────────────────────── */
nav{background:rgba(247,245,241,.92);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;position:sticky;top:0;z-index:100;
  backdrop-filter:blur(10px);box-shadow:var(--shadow-xs)}
.nav-logo{margin-right:20px;padding:10px 0}
.nav-logo img{height:32px;display:block}
.nav-links{display:flex;gap:2px;flex:1}
.nav-links a{font-family:var(--font-ui);font-size:11px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;padding:14px 11px;color:var(--muted);transition:color .15s;white-space:nowrap}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--text);border-bottom:2px solid var(--maroon)}
.nav-right a{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--muted);padding:14px 0 14px 12px;opacity:.6}

/* ── GAME HEADER ─────────────────────────────────────────────────────────── */
.gh{background:linear-gradient(180deg,#F4E7E7 0%,#F7F5F1 65%);
  border-bottom:1px solid var(--maroon-line);padding:28px 24px 22px}
.gh-top{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:860px;margin:0 auto}
.gh-team{flex:1}
.gh-logo{height:72px;width:72px;object-fit:contain;display:block;flex-shrink:0}
.gh-team-name{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--text);line-height:1.2}
.gh-team-sub{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.gh-score-block{text-align:center;flex-shrink:0}
.gh-score{display:flex;align-items:center;gap:0;justify-content:center}
.gh-score-n{font-family:var(--font-display);font-size:64px;font-weight:700;line-height:1;min-width:56px;text-align:center}
.gh-score-n.umass{color:var(--maroon)}
.gh-score-n.opp{color:var(--muted2)}
.gh-score-sep{font-size:36px;color:var(--border2);padding:0 8px;line-height:1}
.gh-result{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.gh-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;padding:3px 8px;border-radius:3px}
.badge-w{background:rgba(31,122,77,.12);color:#1F7A4D;border:1px solid rgba(31,122,77,.25)}
.badge-l{background:rgba(178,58,58,.12);color:#B23A3A;border:1px solid rgba(178,58,58,.25)}
.badge-t{background:var(--surface3);color:var(--muted2);border:1px solid var(--border2)}
.badge-ot{background:#E5ECF5;color:#2E5E9E;border:1px solid #C5D5EA}
.badge-sl{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border);font-size:9px}
.badge-conf{background:var(--maroon-dim);color:var(--maroon);border:1px solid var(--maroon-line);font-size:9px}
.gh-opp-right{text-align:right}
.gh-team{display:flex;align-items:center;gap:14px}
.gh-team.gh-right{justify-content:flex-end}
.gh-team-info{}
.gh-team-info.align-right{text-align:right}
.gh-meta-row{max-width:860px;margin:14px auto 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gh-meta-item{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.gh-meta-item svg{opacity:.5}
.gh-meta-sep{color:var(--border2);font-size:10px}
.gh-back{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--muted);opacity:.6;margin-left:auto;display:flex;align-items:center;gap:4px}
.gh-back:hover{opacity:1;color:var(--text)}

/* ── SECTION WRAPPER ─────────────────────────────────────────────────────── */
.page{max-width:860px;margin:0 auto;padding:0 24px 60px}
.sec{border-top:1px solid var(--border);padding-top:20px;margin-top:20px}
.sec-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sec-title{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.sec-badge{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  padding:2px 7px;border-radius:3px}

/* ── SHOTS TABLE ─────────────────────────────────────────────────────────── */
.shots-table{width:100%;border-collapse:collapse}
.shots-table th{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--muted);padding:6px 10px;text-align:center;border-bottom:1px solid var(--border)}
.shots-table th:first-child{text-align:left}
.shots-table td{font-size:15px;font-weight:700;padding:8px 10px;text-align:center;
  border-top:1px solid var(--border-faint)}
.shots-table td:first-child{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--text);text-align:left}
.shots-table tr.umass-row td{color:var(--maroon)}
.shots-table tr.opp-row td{color:var(--muted2)}
.shots-table td.total-col{font-size:17px;font-weight:900;color:var(--text)}
.shots-table tr.opp-row td.total-col{color:var(--muted2)}

/* ── SCORING ─────────────────────────────────────────────────────────────── */
.period-hdr{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);padding:6px 0 6px;border-top:1px solid var(--border);margin-top:8px}
.period-hdr:first-child{border-top:none;margin-top:0}
.goal-row{display:grid;grid-template-columns:44px 1fr auto;gap:0 12px;align-items:start;
  padding:6px 0 6px 8px;border-top:1px solid var(--border-faint);border-left:3px solid transparent}
.goal-row.u-goal{border-left-color:var(--maroon)}
.goal-time{font-size:13px;font-weight:700;color:var(--muted2);font-variant-numeric:tabular-nums;padding-top:1px}
.goal-body{}
.goal-team{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.goal-team.umass{color:var(--maroon)}
.goal-team.opp{color:var(--muted)}
.goal-scorer{font-size:14px;font-weight:700;color:var(--text)}
.goal-scorer-num{font-size:11px;color:var(--muted2);font-weight:600}
.goal-assists{font-size:12px;color:var(--muted2);margin-top:2px}
.goal-assist-num{font-size:10px;color:var(--muted);font-weight:600}
.goal-type{align-self:start;padding-top:2px}
.gtype{font-size:9px;font-weight:800;letter-spacing:.6px;padding:2px 6px;border-radius:3px;white-space:nowrap}
.gtype-EV{background:var(--surface3);color:var(--muted2)}
.gtype-PP{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border)}
.gtype-SH{background:#E5ECF5;color:#2E5E9E;border:1px solid #C5D5EA}
.gtype-EN{background:var(--surface3);color:var(--muted)}
.gtype-EX{background:var(--surface3);color:var(--muted)}
.no-scoring{font-size:12px;color:var(--muted);padding:12px 0;font-style:italic}

/* ── SPECIAL TEAMS ───────────────────────────────────────────────────────── */
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.st-side{background:var(--surface);padding:14px 16px}
.st-team{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  margin-bottom:10px}
.st-team.umass{color:var(--maroon)}
.st-team.opp{color:var(--muted)}
.st-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.st-label{font-size:11px;color:var(--muted2)}
.st-val{font-size:16px;font-weight:900;color:var(--text)}
.st-pct{font-size:11px;font-weight:600;color:var(--muted);margin-left:4px}
.st-row.opp .st-val{color:var(--muted2)}
.st-pim{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.st-pim-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.st-pim-val{font-size:13px;font-weight:700;color:var(--muted2)}

/* ── GOALIES ─────────────────────────────────────────────────────────────── */
table.gtable{width:100%;border-collapse:collapse}
table.gtable th{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--muted);padding:6px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
table.gtable th:first-child{text-align:left}
table.gtable td{font-size:13px;padding:8px 10px;text-align:right;
  border-top:1px solid var(--border-faint);color:var(--text)}
table.gtable td:first-child{text-align:left}
table.gtable td.dec-W{color:var(--green);font-weight:800}
table.gtable td.dec-L{color:var(--red);font-weight:800}
table.gtable td.dec-T{color:var(--muted2);font-weight:800}
table.gtable td.name{font-weight:700}
table.gtable td.team-label{font-size:9px;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;padding-right:4px}
table.gtable td.team-label.umass{color:var(--maroon)}
table.gtable td.team-label.opp{color:var(--muted)}
table.gtable td.gsax-pos{color:var(--green);font-weight:700}
table.gtable td.gsax-neg{color:var(--red);font-weight:700}
table.gtable td.gsax-na{color:var(--muted);font-style:italic}
.gsax-note{font-size:10px;color:var(--muted);margin-top:8px;font-style:italic}

/* ── PENALTIES ───────────────────────────────────────────────────────────── */
table.ptable{width:100%;border-collapse:collapse}
table.ptable th{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--muted);padding:5px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
table.ptable td{font-size:12px;padding:6px 8px;border-top:1px solid var(--border-faint);color:var(--text)}
table.ptable td.p-time{color:var(--muted2);font-variant-numeric:tabular-nums;white-space:nowrap}
table.ptable td.p-team.umass{color:var(--maroon);font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:.8px}
table.ptable td.p-team.opp{color:var(--muted2);font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:.8px}
table.ptable td.p-player{font-weight:600}
table.ptable td.p-min{text-align:right;color:var(--muted2);font-size:11px;white-space:nowrap}
table.ptable .pd-row td{background:var(--surface2);font-size:9px;font-weight:800;
  letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:4px 8px;
  border-top:1px solid var(--border)}

/* ── ADVANCED STATS (Phase 2) ────────────────────────────────────────────── */
.adv-team-hdr{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--text);padding:10px 14px 6px;display:flex;align-items:center;gap:8px}
.adv-team-hdr-r{justify-content:flex-end}
.adv-grid{display:grid;grid-template-columns:1fr 160px 1fr;border-top:1px solid var(--border)}
.adv-l{text-align:right;font-size:22px;font-weight:900;color:var(--text);padding:9px 14px;
  border-top:1px solid var(--border)}
.adv-r{font-size:22px;font-weight:900;color:var(--muted2);padding:9px 14px;
  border-top:1px solid var(--border)}
.adv-c{text-align:center;padding:9px 8px;border-top:1px solid var(--border)}
.adv-name{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--muted);display:block}
.adv-bar{height:3px;background:var(--surface3);border-radius:2px;margin-top:5px;
  display:flex;overflow:hidden}
.adv-bar-l{background:var(--maroon)}
.adv-bar-r{background:var(--border2)}
.adv-l.lead{color:var(--maroon)}.adv-r.lead{color:var(--muted2)}

/* ── SHOT CHART ──────────────────────────────────────────────────────────── */
.shot-tabs{display:flex;gap:4px;margin-bottom:8px}
.stab{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:4px 12px;border-radius:4px;cursor:pointer;border:1px solid var(--border2);
  color:var(--muted2);background:none}
.stab.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.shot-filters{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.sfilt-label{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.sfilt{font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  padding:3px 9px;border-radius:3px;cursor:pointer;border:1px solid var(--border2);
  color:var(--text);background:var(--surface);transition:all .15s}
.sfilt.off{color:var(--muted);background:none;border-color:var(--border-faint);text-decoration:line-through}
/* CSS-driven shot visibility */
.shot-wrap.hide-miss .shot-miss{display:none}
.shot-wrap.hide-block .shot-block{display:none}
.shot-wrap.hide-save .shot-save{display:none}
.shot-wrap.hide-p1 .shot-p1{display:none}
.shot-wrap.hide-p2 .shot-p2{display:none}
.shot-wrap.hide-p3 .shot-p3{display:none}
.shot-wrap.hide-p4 .shot-p4{display:none}
.shot-leg{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.sl-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted2)}
.sl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
/* Shot tooltip */
#shot-tip{position:fixed;display:none;z-index:9999;pointer-events:none;
  background:var(--surface);border:1px solid var(--border2);border-radius:6px;
  padding:8px 12px;font-family:var(--font-ui);min-width:120px;
  box-shadow:var(--shadow-sm)}
#shot-tip .st-name{font-size:13px;font-weight:700;color:var(--text)}
#shot-tip .st-time{font-size:11px;color:var(--muted2);margin-top:2px}
#shot-tip .st-type{font-size:9px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;margin-top:4px;padding:2px 5px;border-radius:3px;display:inline-block}

/* ── GSAX (Phase 2) ──────────────────────────────────────────────────────── */
.gsax-pos{color:#4a9e6a;font-weight:700}
.gsax-neg{color:#b84a4a;font-weight:700}
.gsax-na{color:var(--muted);font-style:italic}

/* ── ERROR STATE ─────────────────────────────────────────────────────────── */
.error-state{text-align:center;padding:80px 24px}
.error-state h2{font-family:var(--font-display);font-size:22px;color:var(--text);margin-bottom:8px}
.error-state p{font-size:13px;color:var(--muted)}
.error-state a{color:var(--maroon)}

/* ── RESPONSIVE ──────────────────────────────────────────────────────────── */
@media(max-width:600px){
  .gh-score-n{font-size:48px}
  .gh-team-name{font-size:13px}
  .st-grid{grid-template-columns:1fr}
  .gh-meta-row{gap:8px}
  .goal-row{grid-template-columns:40px 1fr auto;gap:0 8px}
  .page{padding:0 14px 48px}
  .gh{padding:20px 14px 16px}
}
</style>

<script>
// ── Helpers ─────────────────────────────────────────────────────────────────

const MONTHS = ['','January','February','March','April','May','June',
                'July','August','September','October','November','December'];

const MONTH_ABBR = ['','Jan','Feb','Mar','Apr','May','Jun',
                    'Jul','Aug','Sep','Oct','Nov','Dec'];

function gameYear(season, month) {
  const start = parseInt(season.split('-')[0]);
  return month >= 7 ? start : start + 1;
}

function keyToDate(key) {
  const [season, md] = key.split(':');
  const [m, d] = md.split('/').map(Number);
  const year = gameYear(season, m);
  return { m, d, year,
    long: `${MONTHS[m]} ${d}, ${year}`,
    short: `${MONTH_ABBR[m]} ${d}, ${year}` };
}

function fmtSvp(v) {
  if (v == null || isNaN(v)) return '---';
  return v.toFixed(3).replace('0.', '.');
}

function isDec(dec) { return ['W','L','T'].includes(dec); }

function pctStr(g, opp) {
  if (!opp) return '—';
  return (g / opp * 100).toFixed(1) + '%';
}

function e(tag, cls, html) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (html != null) el.innerHTML = html;
  return el;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Main render ──────────────────────────────────────────────────────────────

function init() {
  const app    = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  const KEY    = params.get('id');

  if (!KEY) {
    app.innerHTML = `<div class="error-state">
      <h2>No game specified</h2>
      <p>Use <code>game.html?id=2025-26:10/4</code> format,
         or <a href="game_log.html">browse the game log</a>.</p>
    </div>`;
    return;
  }

  const box  = (typeof BOXSCORES !== 'undefined') ? BOXSCORES[KEY] : null;
  const meta = (typeof GAME_META  !== 'undefined') ? GAME_META[KEY]  : null;

  if (!box || !meta) {
    app.innerHTML = `<div class="error-state">
      <h2>Game not found</h2>
      <p>No data found for <strong>${esc(KEY)}</strong>.
         Only 2022-23 through 2025-26 games are supported.
         <a href="game_log.html">← Back to game log</a></p>
    </div>`;
    return;
  }

  // ── Derived values ───────────────────────────────────────────────────────
  const date   = keyToDate(KEY);
  const isOT   = box.shots.u.length > 3;
  const isHome = meta.v === 'H';
  const isAway = meta.v === 'A';
  const uGoals = meta.ug;
  const oGoals = meta.og;
  const result = meta.r; // W / L / T

  const uSOG = box.shots.u.reduce((a,b) => a+b, 0);
  const oSOG = box.shots.o.reduce((a,b) => a+b, 0);

  // Venue display
  let venueStr = '';
  if (isHome)    venueStr = `${meta.arena || 'Mullins Center'} · ${meta.city || 'Amherst'}`;
  else if (isAway) venueStr = `at ${meta.arena || '—'}${meta.city ? ' · ' + meta.city : ''}`;
  else           venueStr = `${meta.arena || 'Neutral Site'}${meta.city ? ' · ' + meta.city : ''}`;

  // Season record context (just show season)
  const seasonLabel = KEY.split(':')[0];

  // Has SL coverage?
  const hasSL = !!meta.sl_id;

  // ── Logo helper ──────────────────────────────────────────────────────────
  const lm = (typeof LOGO_MAP !== 'undefined') ? LOGO_MAP : {};
  function tLogo(name, h=20) {
    const src = lm[name];
    return src ? `<img src="${src}" height="${h}" style="vertical-align:middle;object-fit:contain;flex-shrink:0">` : '';
  }

  function ghTeam(name, sub, alignRight=false) {
    const src = lm[name];
    const logoEl = src
      ? `<img src="${src}" class="gh-logo" alt="${esc(name)}">`
      : `<div class="gh-logo" style="background:var(--surface3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted)">${esc(name.slice(0,3).toUpperCase())}</div>`;
    const displayName = name === 'UMass Minutemen' ? 'UMass' : name;

  // ── Build header ─────────────────────────────────────────────────────────

  const headerHTML = `

  // ── SL data ──────────────────────────────────────────────────────────────

  function fmtSec(s) {
    if (!s) return '—';

  function barPct(u, o) {
    const tot = (u || 0) + (o || 0);

  // ── SportLogiq advanced stats section ────────────────────────────────────
  let slHTML = '';
  if (slXG) {
    slHTML = `

    ${advRow(slXG.xg_u.toFixed(2), slXG.xg_o.toFixed(2), 'Expected Goals (xG)')}
    ${slXG.sc_u || slXG.sc_o ? advRow(slXG.sc_u, slXG.sc_o, 'Scoring chances') : ''}
    ${slXG.ga_u || slXG.ga_o ? advRow(slXG.ga_u, slXG.ga_o, 'Grade A chances') : ''}

  } else if (hasSL) {

<div class="sec">

  // ── Shot chart section ────────────────────────────────────────────────────

    const PD_LABEL  = {1:'1st',2:'2nd',3:'3rd',4:'OT',5:'OT2'};
    const OUT_CLASS = {0:'shot-goal',1:'shot-save',2:'shot-miss',3:'shot-block'};
    const OUT_LABEL = {0:'Goal',1:'On net',2:'Missed',3:'Blocked'};
    const OUT_COLOR = {0:'#d4af37',1:null,2:null,3:null};  // null = use team color

    function fmtTime(sec) {
      if (sec == null) return '';
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2,'0')}`;
    }

    function shotDot(s) {
      const [team, x, y, outcome, period] = s;
      const timeSec  = s.length > 5 ? s[5] : null;
      const playerId = s.length > 6 ? s[6] : null;

      // Coordinate mapping: right OZ for UMass, left OZ for opp

    <circle cx="507" cy="62"  r="3"  fill="#cc1e1e"/>
    <circle cx="507" cy="193" r="46" fill="none" stroke="#cc1e1e" stroke-width="1.5"/>
    <circle cx="507" cy="193" r="3"  fill="#cc1e1e"/>
    <!-- NZ faceoff dots -->
    <circle cx="240" cy="62"  r="3" fill="#cc1e1e"/>
    <circle cx="240" cy="193" r="3" fill="#cc1e1e"/>
    <circle cx="360" cy="62"  r="3" fill="#cc1e1e"/>
    <circle cx="360" cy="193" r="3" fill="#cc1e1e"/>
    <!-- Center circle -->
    <circle cx="300" cy="127.5" r="46" fill="none" stroke="#cc1e1e" stroke-width="1.5"/>

    <!-- Trapezoids (goalie restricted area behind goal lines) -->

    <line x1="567" y1="94.5"  x2="600" y2="85.5"  stroke="#cc1e1e" stroke-width="1.5"/>
    <line x1="567" y1="160.5" x2="600" y2="169.5" stroke="#cc1e1e" stroke-width="1.5"/>

    <!-- Right crease -->

    <line  x1="567" y1="136.5" x2="579" y2="136.5" stroke="#cc1e1e" stroke-width="2"/>
    <path  d="M 579,118.5 Q 588,127.5 579,136.5" stroke="#cc1e1e" fill="none" stroke-width="2"/>

    const allDots = slShots.map(shotDot).join('');
    const uDots   = slShots.filter(s => s[0] === 0).map(shotDot).join('');
    const oDots   = slShots.filter(s => s[0] === 1).map(shotDot).join('');

    const hasOT   = slShots.some(s => s[4] >= 4);
    const oppName = esc(meta.opp);
    shotHTML = `
<div class="sec">

    </div>
  </div>
</div>`;
  }

  // ── Scoring summary ───────────────────────────────────────────────────────
  function renderScoring(scoring) {
    if (!scoring || !scoring.length) {
      return `<p class="no-scoring">No scoring data available.</p>`;
    }

    const TYPE_LABEL = { EVEN:'EV', PP:'PP', SH:'SH', EN:'EN', EX:'EX' };
    const PD_LABEL   = { '1st':'1st Period','2nd':'2nd Period',
                         '3rd':'3rd Period','OT':'Overtime','SO':'Shootout' };

    let html = '';
    let curPeriod = null;

    for (const g of scoring) {
      if (g.p !== curPeriod) {
        curPeriod = g.p;
        html += `<div class="period-hdr">${PD_LABEL[g.p] || g.p}</div>`;
      }

      if (!g.sc && g.sn == null) continue; // skip blank placeholders

      const isU    = g.tm === 'U';
      const tyCode = g.ty || 'EVEN';

    <div class="goal-assists">${assistStr}</div>
  </div>

</div>`;

    return html;
  }

  const scoringHTML = `

  // ── Special teams ─────────────────────────────────────────────────────────
  const uPPg   = box.pp.g,      uPPopp  = box.pp.opp;

  const stHTML = `

  // ── Goalies with real GSAx ────────────────────────────────────────────────
  // GSAx = xG Against − Goals Against (positive = better than expected)
  // Uses team-level xG since we don't split per-goalie at this resolution.
  function gsaxCell(xgAgainst, goalsAllowed, hasData) {
    if (!hasData || xgAgainst == null) {
      return `<td class="r gsax-na">—</td>`;
    }
    const val = parseFloat((xgAgainst - goalsAllowed).toFixed(2));
    const cls = val > 0 ? 'gsax-pos' : val < 0 ? 'gsax-neg' : '';
    const str = val > 0 ? `+${val}` : `${val}`;
    return `<td class="r ${cls}">${str}</td>`;
  }

  function goalieRows(goalies, teamCls, teamLabel, isUMass) {
    if (!goalies || !goalies.length) return '';
    // For multi-goalie games, show GSAx only on the primary goalie (first by TOI/dec)
    const primary = goalies[0];
    return goalies.map((g, idx) => {
      const dec    = isDec(g.dec) ? g.dec : '';
      const decCls = dec ? `dec-${dec}` : '';
      const svpStr = fmtSvp(g.svp);
      // GSAx: only for first goalie if we have xG data
      let gsaxTd;
      if (slXG && idx === 0) {
        const xgAgainst  = isUMass ? slXG.xg_o : slXG.xg_u;
        const goalsAllowed = isUMass ? meta.og : meta.ug;
        gsaxTd = gsaxCell(xgAgainst, goalsAllowed, true);
      } else if (slXG && idx > 0) {
        gsaxTd = `<td class="r gsax-na" title="Multi-goalie game — GSAx shown for primary goalie only">—</td>`;
      } else {
        gsaxTd = `<td class="r gsax-na">—</td>`;
      }
      return `<tr>
        <td class="team-label ${teamCls}">${tLogo(isUMass ? 'UMass Minutemen' : teamLabel, 16)} ${teamLabel}</td>
        <td class="name">${esc(g.name)}</td>
        <td class="${decCls}">${dec || '—'}</td>
        <td>${g.sa != null ? g.sa : '—'}</td>
        <td>${g.sv != null ? g.sv : '—'}</td>
        <td>${svpStr}</td>
        <td>${esc(g.toi || '—')}</td>
        ${gsaxTd}
      </tr>`;
    }).join('');
  }

  const gsaxNote = slXG
    ? `<p class="gsax-note">GSAx = xG against minus goals allowed · positive = better than expected.</p>`
    : hasSL
    ? `<p class="gsax-note">GSAx requires <code>sl_xg.js</code> — run <code>build_sl_xg.py</code> to generate it.</p>`
    : '';

  const goaliesHTML = `
<div class="sec">
  <div class="sec-hdr">
    <span class="sec-title">Goalies</span>
    <span class="sec-badge badge-sl">GSAx via SportLogiq</span>
  </div>
  <table class="gtable">
    <thead><tr>
      <th></th><th style="text-align:left">Goalie</th>
      <th>Dec</th><th>SA</th><th>SV</th><th>SV%</th><th>TOI</th><th>GSAx</th>
    </tr></thead>
    <tbody>
      ${goalieRows(box.goalies,    'umass', 'UMass',       true)}
      ${goalieRows(box.opp_goalies,'opp',   meta.opp, false)}
    </tbody>
  </table>
  ${gsaxNote}
</div>`;

  // ── Penalties ─────────────────────────────────────────────────────────────
  function renderPenalties(pens) {
    if (!pens || !pens.length) {
      return `<p class="no-scoring">No penalties recorded.</p>`;
    }

    const PD_LABEL = { '1st':'1st Period','2nd':'2nd Period',
                       '3rd':'3rd Period','OT':'Overtime' };
    let html = `<table class="ptable">
      <thead><tr>
        <th>Time</th><th>Team</th><th>Player</th><th>Infraction</th><th style="text-align:right">Min</th>
      </tr></thead>
      <tbody>`;

    let curPd = null;
    for (const p of pens) {
      if (p.p !== curPd) {
        curPd = p.p;
        html += `<tr class="pd-row"><td colspan="5">${PD_LABEL[p.p] || p.p}</td></tr>`;
      }
      const isU   = p.tm === 'U';
      const tmLbl = isU ? 'UMass' : (meta.opp.split(' ').pop());
      html += `<tr>
        <td class="p-time">${esc(p.t)}</td>
        <td class="p-team ${isU ? 'umass' : 'opp'}">${tmLbl}</td>
        <td class="p-player">${esc(p.pl || '—')}</td>
        <td>${esc(p.of || '—')}</td>
        <td class="p-min">${p.m}'</td>
      </tr>`;
    }
    html += '</tbody></table>';
    return html;
  }

  const penaltiesHTML = `
<div class="sec">
  <div class="sec-hdr"><span class="sec-title">Penalties</span></div>
  ${renderPenalties(box.pens)}
</div>`;

  // ── Assemble page ─────────────────────────────────────────────────────────
  app.innerHTML = `
${headerHTML}
<div class="page">
  ${slHTML}
  ${shotsHTML}
  ${shotHTML}
  ${scoringHTML}
  ${stHTML}
  ${goaliesHTML}
  ${penaltiesHTML}
</div>`;

  // Tab switcher for shot chart
  window.setTab = function(btn, mode) {
    document.querySelectorAll('.stab').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    ['u','o','both'].forEach(m => {
      const el = document.getElementById('chart-' + m);
      if (el) el.style.display = m === mode ? '' : 'none';
    });
  };

  // Toggle missed/blocked/save visibility
  window.toggleShots = function(btn) {
    const hide  = btn.dataset.hide;
    const wrap  = document.getElementById('shot-chart-wrap');
    const cls   = 'hide-' + hide;
    const isOff = wrap.classList.toggle(cls);
    btn.classList.toggle('off', isOff);
  };

  // Toggle period visibility
  window.togglePeriod = function(btn) {
    const period = btn.dataset.period;
    const wrap   = document.getElementById('shot-chart-wrap');
    const cls    = 'hide-p' + period;
    const isOff  = wrap.classList.toggle(cls);
    btn.classList.toggle('off', isOff);
  };

  // Shot hover tooltip
  (function() {
    // Create tooltip div once
    let tip = document.getElementById('shot-tip');
    if (!tip) {
      tip = document.createElement('div');
      tip.id = 'shot-tip';
      document.body.appendChild(tip);
    }

    const OUT_COLOR = {'Goal':'#d4af37','On net':'#5db85d','Missed':'#888','Blocked':'#888'};
    const TEAM_LABEL = {0:'UMass',1:'${esc(meta.opp)}'};

    function showTip(e, dot) {
      let data;
      try { data = JSON.parse(dot.dataset.tip); } catch(ex) { return; }
      const nameStr = data.name || (data.team === 0 ? 'UMass' : '${esc(meta.opp)}');
      const col = OUT_COLOR[data.type] || '#888';
      tip.innerHTML =
        `<div class="st-name">${nameStr}</div>` +
        `<div class="st-time">${data.time}</div>` +
        `<span class="st-type" style="background:${col}22;color:${col}">${data.type}</span>`;
      tip.style.display = 'block';
      moveTip(e);
    }

    function moveTip(e) {
      let x = e.clientX + 14, y = e.clientY - 10;
      if (x + 160 > window.innerWidth)  x = e.clientX - 165;
      if (y + 80  > window.innerHeight) y = e.clientY - 85;
      tip.style.left = x + 'px';
      tip.style.top  = y + 'px';
    }

    const wrap = document.getElementById('shot-chart-wrap');
    if (wrap) {
      wrap.addEventListener('mouseover', e => {
        const dot = e.target.closest('.shot-dot');
        if (dot) showTip(e, dot);
      });
      wrap.addEventListener('mousemove', e => {
        if (tip.style.display !== 'none') moveTip(e);
      });
      wrap.addEventListener('mouseout', e => {
        if (!e.relatedTarget || !e.relatedTarget.closest?.('.shot-dot')) {
          tip.style.display = 'none';
        }
      });
    }
  })();

  // Update page title
  document.title = `${meta.opp} · ${date.short} — UMass Hockey`;
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
