<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F1;--surface:#FFFFFF;--surface2:#FAF8F4;--surface3:#EFEBE3;
  --border:#E4DFD7;--border2:#CEC8BD;--border-faint:#EFEBE4;
  --text:#1B1714;--muted:#8B847A;--muted2:#A9A299;
  --maroon:#881C1C;--maroon-light:#F4E7E7;--maroon-line:#E2C4C4;
  --gold:#B0892E;--gold-dim:#F6EFDD;--gold-border:#E6D5A8;
  --green:#1A8A50;--green-bg:rgba(26,138,80,.08);--green-border:rgba(26,138,80,.2);
  --blue:#2E5E9E;--blue-bg:#E5ECF5;--blue-border:#C5D5EA;
  --font-display:'Zilla Slab',Georgia,serif;
  --font-ui:'Oswald','Arial Narrow',sans-serif;
  --font-body:'Source Sans 3',system-ui,sans-serif;
  --shadow-xs:0 1px 2px rgba(40,30,20,.05);
  --shadow-sm:0 1px 3px rgba(40,30,20,.07),0 1px 2px rgba(40,30,20,.04);
}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh}

/* Nav */
nav{background:rgba(247,245,241,.92);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;position:sticky;top:0;z-index:100;
  backdrop-filter:blur(10px);box-shadow:var(--shadow-xs)}
.nav-logo{color:var(--text);text-decoration:none;display:flex;align-items:center;gap:10px;margin-right:32px;padding:10px 0}
.nav-links{display:flex;gap:4px;align-items:center}
.nav-links a{padding:5px 10px;border-radius:5px;font-size:11px;font-weight:700;
  letter-spacing:1.5px;color:var(--muted2);text-decoration:none;
  font-family:var(--font-ui);text-transform:uppercase;transition:color .15s;
  border-bottom:2px solid transparent}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--text);border-bottom-color:var(--maroon)}
.nav-links a.external{color:var(--maroon)}

/* Header */
.header{padding:28px 24px 22px;border-bottom:1px solid var(--border)}
.header-inner{max-width:1180px;margin:0 auto}
.header-eyebrow{font-family:var(--font-ui);font-size:10px;font-weight:800;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.header-title{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--text);
  margin-bottom:18px;letter-spacing:-.3px}



/* Controls */
.controls{padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.controls-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctrl-label{font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--muted);white-space:nowrap}
.toggle-group{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;padding:3px}
.toggle-btn{font-family:var(--font-ui);font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;padding:4px 12px;border-radius:4px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.toggle-btn.active{background:var(--maroon);color:#fff}
.ctrl-select{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.3px;
  text-transform:uppercase;background:var(--surface);border:1px solid var(--border2);
  color:var(--text);padding:5px 10px;border-radius:4px;cursor:pointer;appearance:none}
.ctrl-select:focus{outline:none;border-color:var(--maroon)}
.ctrl-divider{width:1px;height:22px;background:var(--border);flex-shrink:0}
.search-wrap{flex:1;min-width:160px;max-width:260px;position:relative}
.search-input{width:100%;font-family:var(--font-ui);font-size:11px;font-weight:600;
  background:var(--surface);border:1px solid var(--border2);color:var(--text);
  padding:5px 28px 5px 10px;border-radius:4px}
.search-input:focus{outline:none;border-color:var(--maroon)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--muted2);font-size:14px;line-height:1;display:none}
.reset-btn{font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;background:none;border:1px solid var(--border2);
  color:var(--muted2);padding:5px 10px;border-radius:4px;cursor:pointer}
.reset-btn:hover{border-color:var(--maroon);color:var(--maroon)}
.multi-select-wrap{position:relative}
.multi-select-btn{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.3px;
  text-transform:uppercase;background:var(--surface);border:1px solid var(--border2);
  color:var(--text);padding:5px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;
  min-width:100px;text-align:left}
.multi-select-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:200;
  background:var(--surface2);border:1px solid var(--border2);border-radius:6px;
  min-width:110px;padding:4px 0;box-shadow:var(--shadow-sm)}
.multi-select-panel.open{display:block}
.multi-opt{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;
  font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--text);white-space:nowrap}
.multi-opt:hover{background:var(--surface3)}
.multi-opt input[type=checkbox]{accent-color:var(--maroon);cursor:pointer;flex-shrink:0}
.multi-opt-all{border-bottom:1px solid var(--border);padding-bottom:7px;margin-bottom:2px;color:var(--maroon)}

/* Result meta */
.result-meta{font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--muted);padding:9px 24px;
  border-bottom:1px solid var(--border);background:var(--surface2)}
.result-meta-inner{max-width:1180px;margin:0 auto}

/* Table */
.table-wrap{overflow-x:auto;max-width:1180px;margin:0 auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{font-family:var(--font-ui);font-size:9px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--muted);padding:10px 10px;
  border-bottom:2px solid var(--border2);text-align:left;
  background:var(--surface2);cursor:pointer;white-space:nowrap;user-select:none;
  position:sticky;top:55px}
thead th:hover{color:var(--text)}
thead th.sorted{color:var(--maroon)}
thead th.asc::after{content:'↑';color:var(--maroon);margin-left:4px}
thead th.desc::after{content:'↓';color:var(--maroon);margin-left:4px}
thead th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--border-faint);transition:background .1s}
tbody tr:hover{background:var(--surface2)}
td{padding:9px 10px;vertical-align:middle}
td.r{text-align:right;font-variant-numeric:tabular-nums}
td.name-cell{font-weight:600;white-space:nowrap}
td.name-cell.active-player{color:var(--gold)}
.group-hdr{background:var(--surface3);border-top:2px solid var(--border2)}
.group-hdr td{font-family:var(--font-ui);font-size:10px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--muted);padding:8px 10px;cursor:default}

/* Badges */
.pos-badge{font-family:var(--font-ui);font-size:9px;font-weight:800;letter-spacing:.5px;
  padding:2px 6px;border-radius:3px;display:inline-block}
.pos-F{background:var(--surface3);color:var(--muted)}
.pos-D{background:#EAF0F9;color:#2E5E9E}
.pos-G{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border)}

.rd-badge{font-family:var(--font-ui);font-size:10px;font-weight:800;
  padding:2px 7px;border-radius:3px;display:inline-block;white-space:nowrap}
.rd-1{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border)}
.rd-2{background:var(--maroon-light);color:var(--maroon);border:1px solid var(--maroon-line)}
.rd-mid{background:var(--surface3);color:var(--text)}
.rd-late{background:var(--surface3);color:var(--muted)}
.rd-pending{background:var(--surface3);color:var(--muted2);border:1px dashed var(--border2);font-style:italic}

.tier-badge{font-family:var(--font-ui);font-size:9px;font-weight:800;letter-spacing:.4px;
  padding:2px 7px;border-radius:3px;display:inline-block;white-space:nowrap}
.tier-nhl{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.tier-ahl{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.tier-echl{background:var(--surface3);color:var(--muted2)}
.tier-europe{background:#F0EAF6;color:#6B46A0}
.tier-active_college{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border)}
.tier-other{background:var(--surface3);color:var(--muted2)}
</style>
</head>

const DRAFT_YEARS = [1991, 1993, 1994, 2001, 2002, 2003, 2005, 2006, 2007, 2008, 2011, 2013, 2014, 2015, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026];
const ROSTER_SEASONS = ["2026-27", "2025-26", "2024-25", "2023-24", "2022-23", "2021-22", "2020-21", "2019-20", "2018-19", "2017-18", "2016-17", "2015-16", "2014-15", "2013-14", "2012-13", "2011-12", "2010-11", "2009-10", "2008-09", "2007-08", "2006-07", "2005-06", "2004-05", "2003-04", "2002-03", "2001-02", "2000-01", "1997-98", "1996-97", "1995-96", "1994-95", "1993-94"];

function playerSeasons(p) {
  if(!p.fu || !p.lu) return new Set();
  const fy = parseInt(p.fu.split('-')[0]);
  const ly = parseInt(p.lu.split('-')[0]);
  const out = new Set();
  for(let y=fy; y<=ly; y++) out.add(y+'-'+String(y+1).slice(2));
  return out;
}

function umassRange(p) {
  if(!p.fu) return '—';
  const fy = p.fu.split('-')[0];
  const ly = p.lu ? p.lu.split('-')[0] : fy;
  if(fy === ly) return p.fu;
  return fy + '–' + p.lu.split('-')[1];
}

let sortCol='dy', sortDir=1, groupMode='none', groupVal='', searchQ='', filterRounds=new Set();

function setGroup(g) {
  groupMode=g; groupVal='';
  ['none','draft','roster'].forEach(k=>{
    document.getElementById('btn-'+k).classList.toggle('active',k===g);
  });
  const sel=document.getElementById('group-select');
  if(g==='none'){
    sel.style.display='none';
  } else {
    sel.style.display='';
    const opts=g==='draft'
      ? DRAFT_YEARS.map(y=>'<option value="'+y+'">'+(y===2026?'2026 Draft (Jun 27)':y+' Draft')+'</option>')
      : ROSTER_SEASONS.map(s=>'<option value="'+s+'">'+s+'</option>');
    sel.innerHTML='<option value="">— Select —</option>'+opts.join('');
    sel.value='';
  }
  render();
}

function toggleRoundPanel(e){
  e.stopPropagation();
  document.getElementById('round-panel').classList.toggle('open');
}
function onRdAll(cb){
  document.querySelectorAll('.rd-cb').forEach(c=>c.checked=false);
  filterRounds=new Set();
  updateRoundBtn();
  render();
}
function onRdCb(){
  filterRounds=new Set();
  document.querySelectorAll('.rd-cb:checked').forEach(c=>filterRounds.add(parseInt(c.value)));
  document.getElementById('rd-all').checked=filterRounds.size===0;
  updateRoundBtn();
  render();
}
function updateRoundBtn(){
  const btn=document.getElementById('round-btn');
  if(filterRounds.size===0){
    btn.textContent='All rounds ▾';
  } else {
    const labels=[...filterRounds].sort((a,b)=>a-b).map(r=>'R'+r).join(', ');
    btn.textContent=labels+' ▾';
  }
}
document.addEventListener('click',function(e){
  const wrap=document.getElementById('round-wrap');
  if(wrap&&!wrap.contains(e.target)) document.getElementById('round-panel').classList.remove('open');
});

function sort(col) {
  if(sortCol===col) sortDir*=-1; else {sortCol=col; sortDir=1;}
  document.querySelectorAll('thead th[data-sort]').forEach(th=>{
    th.classList.remove('sorted','asc','desc');
    if(th.dataset.sort===sortCol) th.classList.add('sorted',sortDir===1?'asc':'desc');
  });
  render();
}

function onSearch(el){
  searchQ=el.value.trim().toLowerCase();
  document.getElementById('search-clear').style.display=searchQ?'':'none';
  render();
}

function clearSearch(){
  document.getElementById('search').value='';
  searchQ='';
  document.getElementById('search-clear').style.display='none';
  render();
}

function resetAll(){
  sortCol='dy'; sortDir=1; searchQ=''; filterRounds=new Set();
  document.getElementById('search').value='';
  document.getElementById('search-clear').style.display='none';
  document.querySelectorAll('.rd-cb').forEach(c=>c.checked=false);
  document.getElementById('rd-all').checked=true;
  updateRoundBtn();
  setGroup('none');
}

function sortVal(p,col){
  switch(col){
    case 'name':    return p.n;
    case 'pos':     return p.pos;
    case 'dy':      return p.dy;
    case 'dr':      return p.dr;
    case 'dp':      return p.dp;
    case 'dt':      return p.dt;
    case 'umass':   return p.fu||'';
    case 'gp':      return p.gp;
    case 'g':       return p.sk_g??-1;
    case 'a':       return p.sk_a??-1;
    case 'pts':     return p.pts??-1;
    case 'pim':     return p.pim??-1;
    case 'tier':    return p.tier;
    case 'nhl_gp':  return p.nhl;
    case 'nhl_g':   return p.nhl_g??-1;
    case 'nhl_a':   return p.nhl_a??-1;
    case 'nhl_pts': return p.nhl_pts??-1;
    default:        return '';
  }
}

function rdBadge(r){
  if(r===0) return '<span class="rd-badge rd-pending">TBD</span>';
  const cls=r===1?'rd-1':r===2?'rd-2':r<=5?'rd-mid':'rd-late';
  return '<span class="rd-badge '+cls+'">R'+r+'</span>';
}

const TIER_LABEL={nhl:'NHL',ahl:'AHL',echl:'ECHL',europe:'Europe',active_college:'Active',other:'Other'};

function tierBadge(t){
  return '<span class="tier-badge tier-'+t+'">'+(TIER_LABEL[t]||t)+'</span>';
}

function posBadge(p){
  const pc=p||'?';
  return '<span class="pos-badge pos-'+pc+'">'+pc+'</span>';
}

function rowHTML(p){
  const nc=p.active?'name-cell active-player':'name-cell';
  const isPending=!!p.pending;
  // NCAA (UMass) columns
  const ncGP=isPending?'—':(p.gp>0?p.gp:(p.fu?0:'—'));
  const ncG=p.sk_g===null?'—':(p.sk_g!==undefined?p.sk_g:'—');
  const ncA=p.sk_a===null?'—':(p.sk_a!==undefined?p.sk_a:'—');
  const ncP=p.pts===null?'—':(p.pts!==undefined?p.pts:'—');
  const ncPIM=p.pim===null?'—':(p.pim!==undefined?p.pim:'—');
  // NHL columns
  const nhlGP=p.nhl>0?p.nhl:'—';
  const nhlG=isPending?'—':(p.nhl_g===null?'—':(p.nhl_g>0?p.nhl_g:(p.nhl>0?p.nhl_g:'—')));
  const nhlA=isPending?'—':(p.nhl_a===null?'—':(p.nhl_a>0?p.nhl_a:(p.nhl>0?p.nhl_a:'—')));
  const nhlP=isPending?'—':(p.nhl_pts===null?'—':(p.nhl_pts>0?p.nhl_pts:(p.nhl>0?p.nhl_pts:'—')));
  const nhlGPStyle=p.nhl>0?'font-weight:600;color:var(--green)':'color:var(--muted2)';
  const nhlPtsStyle=p.nhl>0?'font-weight:700;color:var(--green)':'color:var(--muted2)';
  const pickCell=isPending?'<span style="color:var(--muted2);font-style:italic">—</span>':'#'+p.dp;
  const teamCell=isPending?'<span style="color:var(--muted2);font-style:italic">TBD</span>':p.dt;
  return '<tr>'+
    '<td class="'+nc+'">'+p.n+'</td>'+
    '<td>'+posBadge(p.pos)+'</td>'+
    '<td style="font-variant-numeric:tabular-nums">'+p.dy+'</td>'+
    '<td>'+rdBadge(p.dr)+'</td>'+
    '<td class="r" style="color:var(--muted2)">'+pickCell+'</td>'+
    '<td style="color:var(--muted2)">'+teamCell+'</td>'+
    '<td>'+tierBadge(p.tier)+'</td>'+
    '<td class="r" style="'+nhlGPStyle+'">'+nhlGP+'</td>'+
    '<td class="r" style="color:var(--muted2)">'+nhlG+'</td>'+
    '<td class="r" style="color:var(--muted2)">'+nhlA+'</td>'+
    '<td class="r" style="'+nhlPtsStyle+'">'+nhlP+'</td>'+
    '<td style="font-size:12px;color:var(--muted);border-left:2px solid var(--border-faint)">'+umassRange(p)+'</td>'+
    '<td class="r">'+ncGP+'</td>'+
    '<td class="r" style="color:var(--muted2)">'+ncG+'</td>'+
    '<td class="r" style="color:var(--muted2)">'+ncA+'</td>'+
    '<td class="r" style="font-weight:700">'+ncP+'</td>'+
    '<td class="r" style="color:var(--muted2)">'+ncPIM+'</td>'+
    '</tr>';
}

function groupHdrHTML(label){
  return '<tr class="group-hdr"><td colspan="17">'+label+'</td></tr>';
}

function render(){
  const sel=document.getElementById('group-select');
  groupVal=sel?sel.value:'';

  let data=PLAYERS.filter(p=>{
    if(searchQ){
      const hay=(p.n+' '+p.dt).toLowerCase();
      if(!hay.includes(searchQ)) return false;
    }
    if(filterRounds.size>0 && !filterRounds.has(p.dr)) return false;
    if(groupMode==='draft'&&groupVal){
      if(p.dy!==parseInt(groupVal)) return false;
    }
    if(groupMode==='roster'&&groupVal){
      const ss=playerSeasons(p);
      if(!ss.has(groupVal)) return false;
    }
    return true;
  });

  data=[...data].sort((a,b)=>{
    const av=sortVal(a,sortCol), bv=sortVal(b,sortCol);
    if(av<bv) return -sortDir; if(av>bv) return sortDir; return 0;
  });

  const tbody=document.getElementById('tbody');
  if(!data.length){
    tbody.innerHTML='<tr><td colspan="17" style="padding:48px 24px;text-align:center;color:var(--muted);font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase">No players match this filter</td></tr>';
    document.getElementById('result-meta').textContent='No results';
    return;
  }

  let html='';
  if(groupMode==='draft'&&!groupVal){
    const byYear={};
    data.forEach(p=>{if(!byYear[p.dy])byYear[p.dy]=[];byYear[p.dy].push(p);});
    const years=[...new Set(data.map(p=>p.dy))].sort((a,b)=>a-b);
    years.forEach(y=>{
      const picks=byYear[y];
      const pending=picks.filter(p=>p.pending).length;
      const confirmed=picks.length-pending;
      let label=y+' NHL Draft';
      if(confirmed>0&&pending>0) label+=' — '+confirmed+' pick'+(confirmed!==1?'s':'')+' + '+pending+' pending';
      else if(pending>0) label+=' — '+pending+' prospect'+(pending!==1?'s':'')+' (draft Jun 27)';
      else label+=' — '+picks.length+' pick'+(picks.length!==1?'s':'');
      html+=groupHdrHTML(label);
      picks.forEach(p=>html+=rowHTML(p));
    });
  } else {
    html=data.map(rowHTML).join('');
  }

  tbody.innerHTML=html;

  const nhlC=data.filter(p=>p.tier==='nhl').length;
  const acC=data.filter(p=>p.tier==='active_college'&&!p.pending).length;
  const pendC=data.filter(p=>p.pending).length;
  let meta=data.length+' player'+(data.length!==1?'s':'');
  if(nhlC) meta+=' · '+nhlC+' NHL debuts';
  if(acC)  meta+=' · '+acC+' active';
  if(pendC) meta+=' · '+pendC+' pending (Jun 27)';
  document.getElementById('result-meta').textContent=meta;
}

// Init sort header
(function(){
  const th=document.querySelector('thead th[data-sort="'+sortCol+'"]');
  if(th) th.classList.add('sorted','asc');
})();

render();
