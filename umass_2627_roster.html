<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2026–27 UMass Minutemen — Roster Preview</title>

<style>



*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0c10;--surface:#111318;--border:#1e2230;--text:#e2e6f0;--muted:#5a6070;--accent:#881c1c;--gold:#cc9a1a}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── Header ── */
.header{padding:26px 40px 18px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(136,28,28,.08) 0%,transparent 50%)}
.header-top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.school-badge{display:flex;align-items:center;gap:14px}
.school-logo{width:52px;height:52px;background:#881c1c;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:#fff;border:2px solid #cc4444;flex-shrink:0}
.title-block h1{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;color:#fff;line-height:1.1}
.title-block h1 span{color:var(--gold)}
.title-block p{font-size:12px;color:var(--muted);margin-top:4px}
.header-stats{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap;align-items:flex-start}
.hstat{text-align:right}
.hstat-val{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;line-height:1}
.hstat-lbl{font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.8px;text-transform:uppercase}

/* ── Outcome bar ── */
.bar-wrap{padding:14px 40px 10px;border-bottom:1px solid var(--border)}
.outcome-bar{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:8px}
.outcome-seg{display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;color:#fff;cursor:pointer;transition:filter .15s;overflow:hidden;padding:0 6px}
.outcome-seg:hover{filter:brightness(1.2)}
.legend{display:flex;gap:12px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:700;cursor:pointer;padding:3px 7px;border-radius:4px;border:1px solid transparent;transition:all .15s}
.leg-item:hover{border-color:var(--border)}
.leg-item.dimmed{opacity:.25}
.leg-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}

/* ── Controls ── */
.controls{padding:10px 40px;border-bottom:1px solid var(--border);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ctrl-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.btn-row{display:flex;gap:3px}
.btn{padding:4px 11px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--text)}
.btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── Roster grid ── */
.roster-wrap{padding:16px 40px 40px}
.pos-section{margin-bottom:20px}
.pos-header{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#2e3450;padding-bottom:6px;border-bottom:1px solid #141824;margin-bottom:8px}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}

/* ── Player card ── */
.player-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:border-color .15s,background .15s;position:relative;overflow:hidden}
.player-card:hover{border-color:#3a4060;background:#14182a}
.status-stripe{position:absolute;left:0;top:0;bottom:0;width:3px}
.player-number{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:#2e3a50;width:26px;text-align:center;flex-shrink:0}
.player-info{flex:1;min-width:0}
.player-nameline{display:flex;align-items:center;gap:5px}
.player-pos{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted);flex-shrink:0}
.player-name{font-size:13.5px;font-weight:600;color:#d8e4f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-draft{font-size:10px;color:var(--muted);margin-top:1px;font-family:'Barlow Condensed',sans-serif}
.status-badge{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:10px;flex-shrink:0;white-space:nowrap}

/* ── Detail overlay ── */
.overlay{position:fixed;inset:0;background:rgba(5,7,12,.94);z-index:2000;display:none;overflow-y:auto;backdrop-filter:blur(4px)}
.overlay.open{display:block}
.detail{max-width:720px;margin:50px auto;padding:0 24px 60px}
.detail-back{display:inline-flex;align-items:center;gap:7px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);cursor:pointer;padding:6px 0;margin-bottom:20px;transition:color .15s}
.detail-back:hover{color:#4a90d9}
.detail-back svg{width:14px;height:14px}
.detail-name{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;color:#fff;line-height:1;margin-bottom:4px}
.detail-meta{font-size:12px;color:var(--muted);margin-bottom:18px}
.detail-status-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.detail-status-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.detail-status-label{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:#fff}
.detail-team-str{font-size:13px;color:var(--muted)}
.section-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px;margin-top:18px}
.detail-note{font-size:13px;color:#b0bcd4;line-height:1.8;padding:12px 16px;background:rgba(255,255,255,.02);border-radius:6px;border-left:3px solid var(--border)}
.detail-highlight{font-size:13px;color:#c8d8f0;line-height:1.7;padding:12px 16px;background:rgba(74,144,217,.06);border-radius:6px;border-left:3px solid #4a90d9;font-style:italic}
.detail-row{display:flex;gap:24px;flex-wrap:wrap;margin-top:18px}
.detail-field{flex:1;min-width:140px}
.detail-field-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;font-family:'Barlow Condensed',sans-serif}
.detail-field-val{font-size:13px;color:#d0ddf0}

/* ── Career stats table ── */
.stats-table-wrap{overflow-x:auto;margin-top:4px}
.stats-table{width:100%;border-collapse:collapse;font-size:12px;font-family:'Barlow Condensed',sans-serif}
.stats-table th{text-align:left;padding:5px 8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.stats-table td{padding:5px 8px;color:#c0cce0;border-bottom:1px solid #141824;white-space:nowrap}
.stats-table tr:last-child td{border-bottom:none}
.stats-table tr.pro-row td{color:#e0ecff}
.stats-table tr.ncaa-row td{color:#8090a8}
.stats-table tr.other-row td{color:#505868}
.stats-table tr.pro-row td:first-child{color:#fff}
.tier-badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.tier-nhl{background:#f5c51822;color:#f5c518;border:1px solid #f5c51844}
.tier-ahl{background:#4a90d922;color:#4a90d9;border:1px solid #4a90d944}
.tier-echl{background:#5bb85b22;color:#5bb85b;border:1px solid #5bb85b44}
.tier-europe{background:#9b6dd422;color:#9b6dd4;border:1px solid #9b6dd444}
.tier-ncaa{background:#88888822;color:#888;border:1px solid #88888844}

/* ── Tooltip ── */
.tooltip{position:fixed;background:#14182a;border:1px solid #2a3060;border-radius:8px;padding:10px 14px;pointer-events:none;z-index:1000;display:none;max-width:280px;box-shadow:0 12px 40px rgba(0,0,0,.7);font-size:12px}
.tt-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;color:#fff;margin-bottom:3px}
.tt-team{color:#8090b0;font-size:11px}
.tt-note{color:#6070a0;font-size:10px;margin-top:4px;font-style:italic}



</style>
</head>

const SC = {"NHL/AHL": "#e07b39", "AHL": "#4a90d9", "ECHL": "#5bb85b", "Europe": "#9b6dd4", "Active": "#19a87a", "Transferred": "#c47c14", "Out of hockey": "#555b6e"};
const SO = ["NHL/AHL", "AHL", "ECHL", "Europe", "Active", "Transferred", "Out of hockey"];
const NAT = {"USA":"🇺🇸","CAN":"🇨🇦","FIN":"🇫🇮","CZE":"🇨🇿","SWE":"🇸🇪","LAT":"🇱🇻","RUS":"🇷🇺","SVK":"🇸🇰","BLR":"🇧🇾"};

const PRO_LEAGUES = new Set(["NHL","AHL","ECHL","EIHL","SHL","Liiga","HockeyAllsvenskan","Denmark","FPHL","WC","WJC-20","International","France2","QMJHL","OHL","WHL","USHL"]);
const NCAA_RE = /NCAA/i;

function leagueTier(lg) {
  if (!lg || lg==='-') return 'other';
  if (lg==='NHL') return 'nhl';
  if (lg==='AHL') return 'ahl';
  if (lg==='ECHL'||lg==='FPHL'||lg==='EIHL') return 'echl';
  if (PRO_LEAGUES.has(lg)||lg==='SHL'||lg==='Liiga'||lg==='HockeyAllsvenskan'||lg==='Denmark') return 'europe';
  if (NCAA_RE.test(lg)) return 'ncaa';
  return 'other';
}

let activeStatuses = new Set(SO);
let grouping = 'pos';
const idx = {};
ROSTER.forEach(function(p){ idx[p.name]=p; });

function renderRoster() {
  var wrap = document.getElementById('roster-wrap');
  wrap.innerHTML = '';
  var filtered = ROSTER.filter(function(p){ return activeStatuses.has(p.status); });
  if (grouping==='pos') {
    [{label:'Goaltenders',fn:function(p){return p.pos==='G';}},
     {label:'Defensemen', fn:function(p){return p.pos==='D';}},
     {label:'Forwards',   fn:function(p){return p.pos!=='G'&&p.pos!=='D';}}
    ].forEach(function(g){
      var players=filtered.filter(g.fn);
      if(!players.length) return;
      players.sort(function(a,b){return a.number-b.number;});
      appendSection(wrap,g.label+' ('+players.length+')',null,players);
    });
  } else {
    SO.forEach(function(s){
      if(!activeStatuses.has(s)) return;
      var players=filtered.filter(function(p){return p.status===s;});
      if(!players.length) return;
      appendSection(wrap,s+' ('+players.length+')',SC[s],players);
    });
  }
}

function appendSection(wrap,label,color,players){
  var sec=document.createElement('div'); sec.className='pos-section';
  var ph=document.createElement('div'); ph.className='pos-header'; ph.textContent=label;
  if(color) ph.style.color=color;
  sec.appendChild(ph);
  var grid=document.createElement('div'); grid.className='player-grid';
  players.forEach(function(p){grid.appendChild(makeCard(p));});
  sec.appendChild(grid); wrap.appendChild(sec);
}

function makeCard(p){
  var card=document.createElement('div'); card.className='player-card';
  var stripe=document.createElement('div'); stripe.className='status-stripe';
  stripe.style.background=SC[p.status]||'#555'; card.appendChild(stripe);
  var num=document.createElement('div'); num.className='player-number';
  num.textContent='#'+p.number; card.appendChild(num);
  var info=document.createElement('div'); info.className='player-info';
  var nl=document.createElement('div'); nl.className='player-nameline';
  var pos=document.createElement('span'); pos.className='player-pos'; pos.textContent=p.pos;
  var nm=document.createElement('span'); nm.className='player-name';
  nm.textContent=(p.all_american?'★ ':'')+p.name;
  if(p.all_american) nm.style.color='#f5c518';
  nl.appendChild(pos); nl.appendChild(nm);
  var dr=document.createElement('div'); dr.className='player-draft'; dr.textContent=p.draft;
  info.appendChild(nl); info.appendChild(dr); card.appendChild(info);
  var badge=document.createElement('div'); badge.className='status-badge';
  var c=SC[p.status]||'#555';
  badge.style.background=c+'22'; badge.style.color=c; badge.style.border='1px solid '+c+'55';
  badge.textContent=p.status==='Out of hockey'?'Retired':p.status;
  card.appendChild(badge);
  card.addEventListener('mouseenter',function(e){showTip(e,p);});
  card.addEventListener('mouseleave',hideTip);
  card.addEventListener('click',function(){openDetail(p.name);});
  return card;
}

function showTip(e,p){
  var tip=document.getElementById('tooltip');
  var t=p.team&&p.team!=='Retired'?p.league+' · '+p.team:'—';
  tip.innerHTML='<div class="tt-name">'+(p.all_american?'★ ':'')+p.name+'</div><div class="tt-team">'+t+'</div>'+(p.highlight?'<div class="tt-note">'+p.highlight+'</div>':'');
  tip.style.display='block'; moveTip(e);
}
function moveTip(e){
  var tip=document.getElementById('tooltip');
  var x=e.clientX+14,y=e.clientY-10;
  if(x+300>window.innerWidth) x=e.clientX-310;
  if(y+tip.offsetHeight+10>window.innerHeight) y=e.clientY-tip.offsetHeight-10;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){document.getElementById('tooltip').style.display='none';}
document.addEventListener('mousemove',function(e){
  var t=document.getElementById('tooltip');
  if(t.style.display!=='none') moveTip(e);
});

function buildStatsTable(career,isGoalie){

  var html='<div class="stats-table-wrap"><table class="stats-table">';
  if(isGoalie){
    html+='<tr><th>Season</th><th>Team</th><th>League</th><th>GP</th><th>GAA</th><th>SV%</th><th>W-L-T</th></tr>';

    html+='<tr><th>Season</th><th>Team</th><th>League</th><th>GP</th><th>G</th><th>A</th><th>TP</th></tr>';
  }

    var tier=leagueTier(s.league);
    var rowClass=tier==='nhl'||tier==='ahl'||tier==='echl'||tier==='europe'?'pro-row':tier==='ncaa'?'ncaa-row':'other-row';

    else if(tier==='ncaa') tb='<span class="tier-badge tier-ncaa">NCAA</span> ';
    var tm=(s.team||'').replace(/"[AC]+"?\s*$/,'').replace('Loan','<span style="font-size:9px;opacity:.6"> (loan)</span>');
    html+='<tr class="'+rowClass+'">';
    html+='<td style="color:#6080a0;font-size:11px">'+s.season+'</td>';
    html+='<td>'+tm+'</td><td>'+tb+'</td>';
    if(isGoalie){
      html+='<td>'+s.GP+'</td><td>'+s.GAA+'</td><td>'+s.SVpct+'</td><td style="font-size:11px">'+s.WLT+'</td>';
    } else {
      html+='<td>'+s.GP+'</td><td>'+s.G+'</td><td>'+s.A+'</td><td style="font-weight:700;color:#e0ecff">'+s.TP+'</td>';
    }
    html+='</tr>';
  });
  html+='</table></div>'; return html;
}

function buildAwardsSection(p){
  var html = '';
  if (p.awards && p.awards.length) {
    html += '<div class="section-label">Awards & Honors</div>';
    html += '<ul style="list-style:none;padding:0;margin-bottom:18px">';
    p.awards.forEach(function(a){
      html += '<li style="font-size:12px;color:#b0bcd4;padding:3px 0;border-bottom:1px solid #1a2030">'
           + '<span style="color:#cc9a1a;margin-right:6px">◆</span>'+a+'</li>';
    });
    html += '</ul>';
  }
  if (p.records_list && p.records_list.length) {
    html += '<div class="section-label">Program Records</div>';
    html += '<ul style="list-style:none;padding:0;margin-bottom:18px">';
    p.records_list.forEach(function(r){
      html += '<li style="font-size:12px;color:#b0bcd4;padding:3px 0;border-bottom:1px solid #1a2030">'
           + '<span style="color:#9b6dd4;margin-right:6px">▲</span>'+r+'</li>';
    });
    html += '</ul>';
  }
  return html;
}

function openDetail(name){
  var p=idx[name]; if(!p) return;
  var color=SC[p.status]||'#888';
  var flag=NAT[p.nat]||p.nat;
  var isGoalie=p.pos==='G';
  var teamStr=(p.team&&p.team!=='Retired')?p.league+' · '+p.team:(p.status==='Out of hockey'?'Retired from hockey':p.league);
  var nameDisplay=(p.all_american?'<span style="color:#f5c518;margin-right:6px">★</span>':'')+p.name;
  document.getElementById('detail-panel').innerHTML=
    '<div class="detail-back" id="back-btn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>Back to roster</div>'
    +'<div class="detail-name">'+nameDisplay+'</div>'
    +'<div class="detail-meta">#'+p.number+' · '+p.pos+' · '+flag+' · UMass '+p.years_at_umass+'</div>'
    +'<div class="detail-status-row"><div class="detail-status-dot" style="background:'+color+'"></div>'
    +'<div><div class="detail-status-label">'+p.status+'</div><div class="detail-team-str">'+teamStr+'</div></div></div>'
    +(p.highlight?'<div class="section-label">Notable</div><div class="detail-highlight">'+p.highlight+'</div>':'')
    +buildAwardsSection(p)
    +'<div class="section-label">Career path</div><div class="detail-note">'+p.note+'</div>'
    +'<div class="section-label">Career stats (NCAA & Pro)</div>'+buildStatsTable(p.career,isGoalie)
    +'<div class="detail-row"><div class="detail-field"><div class="detail-field-label">Draft</div><div class="detail-field-val">'+p.draft+'</div></div>'
    +'<div class="detail-field"><div class="detail-field-label">Left UMass</div><div class="detail-field-val">'+p.left_after+'</div></div></div>';
  document.getElementById('back-btn').addEventListener('click',closeDetail);
  var ov=document.getElementById('overlay');
  ov.classList.add('open'); ov.scrollTop=0; document.body.style.overflow='hidden';
}
function closeDetail(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeDetail();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDetail();});

function renderBar(){
  var bar=document.getElementById('outcome-bar'); bar.innerHTML='';
  var total=ROSTER.length;
  SO.forEach(function(s){
    var cnt=ROSTER.filter(function(p){return p.status===s;}).length;
    if(!cnt) return;
    var pct=(cnt/total)*100;
    var seg=document.createElement('div'); seg.className='outcome-seg';
    seg.style.width=pct+'%'; seg.style.background=SC[s];
    if(pct>7) seg.textContent=cnt;
    seg.title=s+': '+cnt; bar.appendChild(seg);
  });
}
function toggleStatus(s){
  if(activeStatuses.has(s)){if(activeStatuses.size>1)activeStatuses.delete(s);}
  else activeStatuses.add(s);
  document.querySelectorAll('.leg-item').forEach(function(el){
    el.classList.toggle('dimmed',!activeStatuses.has(el.getAttribute('data-status')));
  });
  renderRoster();
}
function setGroup(g){
  grouping=g;
  document.querySelectorAll('#group-btns .btn').forEach(function(b,i){
    b.classList.toggle('active',['pos','status'][i]===g);
  });
  renderRoster();
}
renderBar(); renderRoster();


</script>
</body>
</html>
